<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{width:380px;height:370px;overflow:hidden}</style></head>

<script src="_kit.js"></script>
<script>
setSeed(5);
const W=380,H=370;

for(const [x,y,r] of [[60,80,8],[330,40,7],[350,200,6],[28,200,6],[250,30,5],[120,40,5]]) s+=sparkle(x,y,r,'#fffbe6',true);

mount(s);
